name: Build ESP32-S3 Camera Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pip
          ~/.platformio/.cache
        key: ${{ runner.os }}-pio
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install platformio
    
    - name: Build firmware
      run: pio run
    
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v3
      with:
        name: esp32s3-camera-firmware
        path: |
          .pio/build/custom-esp32s3/firmware.bin
          .pio/build/custom-esp32s3/bootloader.bin
          .pio/build/custom-esp32s3/partitions.bin
